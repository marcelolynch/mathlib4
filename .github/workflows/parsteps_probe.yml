name: parallel steps semantics probe
on:
  workflow_dispatch:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  wait_on_never_started:
    runs-on: ubuntu-latest
    steps:
      - name: fail first
        run: exit 1
      - name: background that is skipped by the failure
        id: bg
        background: true
        run: sleep 5
      - name: wait on it
        wait: bg
      - name: after
        if: always()
        run: echo "reached; bg outcome=${{ steps.bg.outcome }} conclusion=${{ steps.bg.conclusion }}"

  group_member_failures:
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - name: a fails
            id: a
            run: sleep 2; exit 1
          - name: b ok
            id: b
            run: sleep 3; echo ok
          - name: c fails with continue-on-error
            id: c
            continue-on-error: true
            run: sleep 1; exit 1
          - name: d skipped
            id: d
            if: ${{ false }}
            run: echo never
      - name: normal step after a failed group
        run: echo "should be skipped"
      - name: report
        if: always()
        run: |
          echo "a=${{ steps.a.outcome }}/${{ steps.a.conclusion }} b=${{ steps.b.outcome }}/${{ steps.b.conclusion }} c=${{ steps.c.outcome }}/${{ steps.c.conclusion }} d=${{ steps.d.outcome }}/${{ steps.d.conclusion }}"

  outputs_env_after_group:
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - name: m sets output and env
            id: m
            run: |
              echo "x=42" >> "$GITHUB_OUTPUT"
              echo "FOO=bar" >> "$GITHUB_ENV"
              echo "/tmp/probe-bin" >> "$GITHUB_PATH"
          - name: n
            run: echo n
      - name: read
        run: |
          echo "x=${{ steps.m.outputs.x }} FOO=$FOO"
          echo "$PATH" | tr ':' '\n' | grep -c probe-bin

  bg_if_false_and_waitall:
    runs-on: ubuntu-latest
    steps:
      - name: background uses with if false
        id: co
        if: ${{ false }}
        background: true
        uses: actions/checkout@v4
      - name: wait-all with nothing active
        wait-all:
      - name: after
        run: echo "co outcome=${{ steps.co.outcome }}"

  wait_with_continue_on_error:
    runs-on: ubuntu-latest
    steps:
      - name: bg fails
        id: bg
        background: true
        run: sleep 2; exit 1
      - name: wait with continue-on-error
        continue-on-error: true
        wait: bg
      - name: after
        run: echo "continued; bg outcome=${{ steps.bg.outcome }}"

  cancel_after_failure:
    runs-on: ubuntu-latest
    steps:
      - name: sampler
        id: sampler
        background: true
        run: timeout 300 bash -c 'while true; do date; sleep 2; done'
      - name: fail
        run: exit 1
      - name: cancel sampler
        cancel: sampler
      - name: after
        if: always()
        run: echo "sampler outcome=${{ steps.sampler.outcome }}"
