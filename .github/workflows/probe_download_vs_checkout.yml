name: probe download_vs_checkout
on:
  workflow_dispatch:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  download_vs_checkout:
    runs-on: ubuntu-latest
    steps:
      - name: make a 200 MB staging set
        run: |
          mkdir -p staging
          for i in $(seq 1 200); do head -c 1M /dev/urandom > "staging/f$i.ltar"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-staging
          path: staging/
          compression-level: 0
      - name: clear the workspace
        run: rm -rf staging
      - name: download in the background
        id: dl
        background: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probe-staging
          path: probe-staging
      - name: checkout right after
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: wait for the download
        wait: dl
      - name: count the files
        if: always()
        run: |
          n=$(ls probe-staging 2>/dev/null | wc -l)
          echo "files after checkout: $n of 200"
          test "$n" -eq 200
